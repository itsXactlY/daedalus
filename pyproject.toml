[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daedalus"
version = "0.8.1+daedalus"
description = "Daedalus — a clean, secret-free distribution of the Daedalus self-improving AI agent"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Nous Research" }]
maintainers = [{ name = "Daedalus distribution" }]
license = { text = "MIT" }
dependencies = [
  # Core — pinned to known-good ranges to limit supply chain attack surface
  "openai>=2.21.0,<3",
  "anthropic>=0.39.0,<1",
  "python-dotenv>=1.2.1,<2",
  "httpx>=0.28.1,<1",
  "rich>=14.3.3,<15",
  "tenacity>=9.1.4,<10",
  "pyyaml>=6.0.2,<7",
  "requests>=2.33.0,<3",  # CVE-2026-25645
  "jinja2>=3.1.5,<4",
  "pydantic>=2.12.5,<3",
  # Interactive CLI (prompt_toolkit is used directly by cli.py)
  "prompt_toolkit>=3.0.52,<4",
  # Tools
  "exa-py>=2.9.0,<3",
  "firecrawl-py>=4.16.0,<5",
  "parallel-web>=0.4.2,<1",
  "fal-client>=0.13.1,<1",
  # Text-to-speech (Edge TTS is free, no API key needed)
  "edge-tts>=7.2.7,<8",
  # Skills Hub (GitHub App JWT auth — optional, only needed for bot identity)
  "PyJWT[crypto]>=2.12.0,<3",  # CVE-2026-32597
]

[project.optional-dependencies]
dev = ["debugpy>=1.8.0,<2", "pytest>=9.0.2,<10", "pytest-asyncio>=1.3.0,<2", "pytest-xdist>=3.0,<4", "mcp>=1.2.0,<2"]
messaging = ["python-telegram-bot[webhooks]>=22.6,<23", "discord.py[voice]>=2.7.1,<3", "aiohttp>=3.13.3,<4", "slack-bolt>=1.18.0,<2", "slack-sdk>=3.27.0,<4"]
cron = ["croniter>=6.0.0,<7"]
cli = ["simple-term-menu>=1.0,<2"]
tts-premium = ["elevenlabs>=1.0,<2"]
voice = [
  # Local STT pulls in wheel-only transitive deps (ctranslate2, onnxruntime),
  # so keep it out of the base install for source-build packagers like Homebrew.
  "faster-whisper>=1.0.0,<2",
  "sounddevice>=0.4.6,<1",
  "numpy>=1.24.0,<3",
]
pty = [
  "ptyprocess>=0.7.0,<1; sys_platform != 'win32'",
  "pywinpty>=2.0.0,<3; sys_platform == 'win32'",
]

mcp = ["mcp>=1.2.0,<2"]
homeassistant = ["aiohttp>=3.9.0,<4"]
sms = ["aiohttp>=3.9.0,<4"]
acp = ["agent-client-protocol>=0.9.0,<1.0"]
mistral = ["mistralai>=2.3.0,<3"]
dingtalk = ["dingtalk-stream>=0.1.0,<1"]
feishu = ["lark-oapi>=1.5.3,<2"]
rl = [
  "atroposlib @ git+https://github.com/NousResearch/atropos.git",
  "tinker @ git+https://github.com/thinking-machines-lab/tinker.git",
  "fastapi>=0.104.0,<1",
  "uvicorn[standard]>=0.24.0,<1",
  "wandb>=0.15.0,<1",
]
yc-bench = ["yc-bench @ git+https://github.com/collinear-ai/yc-bench.git ; python_version >= '3.12'"]
all = [
  "daedalus[modal]",
  "daedalus[daytona]",
  "daedalus[messaging]",
  # matrix excluded: python-olm (required by matrix-nio[e2e]) is upstream-broken
  # on modern macOS (archived libolm, C++ errors with Clang 21+). Including it
  # here causes the entire [all] install to fail, dropping all other extras.
  # Users who need Matrix can install manually: pip install 'daedalus[matrix]'
  "daedalus[cron]",
  "daedalus[cli]",
  "daedalus[dev]",
  "daedalus[tts-premium]",
  "daedalus[slack]",
  "daedalus[pty]",
  "daedalus[honcho]",
  "daedalus[mcp]",
  "daedalus[homeassistant]",
  "daedalus[sms]",
  "daedalus[acp]",
  "daedalus[voice]",
  "daedalus[dingtalk]",
  "daedalus[feishu]",
  "daedalus[mistral]",
]

[project.scripts]
# Primary entry points. `uvx daedalus` resolves to the first one.
daedalus = "daedalus_cli.main:main"
daedalus-agent = "run_agent:main"
daedalus-acp = "acp_adapter.entry:main"
# NOTE: deliberately no `hermes*` aliases. Installing this distribution must
# never take over upstream's command names -- `uv tool install` symlinks them
# into ~/.local/bin and would silently shadow a working Hermes install.
# (This comment said "no daedalus* aliases ... shadow a Daedalus install",
# which is self-contradictory next to the daedalus entry points above: the
# fork's original hermes->deadalus sweep rewrote the very word that carried
# the meaning. Hermes is the name that must not be claimed here.)

[tool.setuptools]
# Plugins are discovered by reading their plugin.yaml. Without package-data the
# wheel shipped only the .py files, so every plugin -- Mazemaker included --
# was invisible to a pip/uvx install while working fine from a source checkout.
include-package-data = true

py-modules = ["run_agent", "model_tools", "toolsets", "batch_runner", "trajectory_compressor", "toolset_distributions", "cli", "daedalus_constants", "daedalus_state", "daedalus_time", "daedalus_logging", "rl_cli", "utils"]

[tool.setuptools.package-data]
"*" = ["plugin.yaml", "*.yaml", "*.yml"]

[tool.setuptools.packages.find]
include = ["agent", "tools", "tools.*", "daedalus_cli", "gateway", "gateway.*", "cron", "acp_adapter", "plugins", "plugins.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring external services (API keys, Modal, etc.)",
    "linux_only: only runs on Linux (sys.platform.startswith('linux'))",
    "macos_only: only runs on macOS (sys.platform == 'darwin')",
    "windows_only: only runs on native Windows (sys.platform == 'win32')",
]
addopts = "-m 'not integration' -n auto"
