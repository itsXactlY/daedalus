# Known-good "dGPU completely off the system" config for Optimus laptops.
# Requires: optimus-manager + acpi_call module loaded.
# BIOS Graphics Device must be "Hybrid" (not Discrete).
[optimus]
auto_logout=no
pci_power_control=yes
pci_remove=yes
pci_reset=no
startup_mode=integrated
startup_auto_battery_mode=integrated
# Flip the next line to "hybrid" if the user wants CUDA/nvidia available on AC
# (they then switch manually with: optimus-manager --switch hybrid --no-confirm).
startup_auto_extpower_mode=integrated
switching=acpi_call
