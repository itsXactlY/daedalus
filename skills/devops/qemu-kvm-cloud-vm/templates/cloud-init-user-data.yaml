#cloud-config
hostname: trixi-vm
users:
  - name: alca
    groups: sudo
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    passwd: <openssl passwd -6 PASSWORD>
    ssh_authorized_keys:
      - <cat ~/.ssh/id_ed25519.pub>
ssh_pwauth: true
package_update: true
runcmd:
  - sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
  - systemctl restart ssh
